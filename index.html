        <div class="interactive-area hidden" id="proposal-area">
            <p id="question-text">Will you be my Valentine?</p>
            <div class="buttons">
                <button id="yes-btn">Yes! ❤️</button>
                <button id="no-btn">No</button>
            </div>

            <!-- Choice Modal (Hidden inside the area for layout simple) -->

                <p>Oh no! Is the rose not your style? 🥺 <br>Pick a flower you like:</p>
                <div class="choice-buttons">
                    <button class="choice-btn" data-flower="tulip">🌷 Tulip</button>
                    <button class="choice-btn" data-flower="sunflower">🌻 Sunflower</button>
                    <button class="choice-btn" data-flower="rose">🌹 Rose is fine!</button>
                </div>
            </div>
